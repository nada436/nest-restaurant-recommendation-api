version: '3.9'

services:
  # ─────────────────────────────────────────────
  # NestJS application (development / hot-reload)
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: restaurant-api-dev
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      PORT: '${PORT:-3000}'
      MONGO_URI: '${MONGO_URI}'
      BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET}'
      BETTER_AUTH_URL: '${BETTER_AUTH_URL}'
    env_file:
      - .env
    volumes:
      # Mount source for hot-reload; keep container node_modules
      - .:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - restaurant-network

  # ─────────────────────────────────────────────
  # MongoDB (local dev — no Atlas needed)
  # ─────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: restaurant-mongo-dev
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: '${MONGO_INITDB_ROOT_USERNAME:-admin}'
      MONGO_INITDB_ROOT_PASSWORD: '${MONGO_INITDB_ROOT_PASSWORD:-password}'
      MONGO_INITDB_DATABASE: restaurant_management
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - restaurant-network

  # ─────────────────────────────────────────────
  # Mongo Express — browser-based DB admin UI
  # ─────────────────────────────────────────────
  mongo-express:
    image: mongo-express:1.0
    container_name: restaurant-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: '${MONGO_INITDB_ROOT_USERNAME:-admin}'
      ME_CONFIG_MONGODB_ADMINPASSWORD: '${MONGO_INITDB_ROOT_PASSWORD:-password}'
      ME_CONFIG_MONGODB_URL: 'mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-password}@mongo:27017/'
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - restaurant-network

volumes:
  mongo_dev_data:
    driver: local

networks:
  restaurant-network:
    driver: bridge
